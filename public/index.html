<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>My Website</title>
    <style>
          @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
          * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }
          body {
            font-family: 'Inter', sans-serif;

            --light: hsl(220, 50%, 90%);
              --primary: hsl(255, 30%, 55%);
              --focus: hsl(210, 90%, 50%);
              --border-color: hsla(0, 0%, 100%, .2);
              --global-background: hsl(220, 25%, 10%);
              --background: linear-gradient(to right, hsl(210, 30%, 20%), hsl(255, 30%, 25%));
              --shadow-1: hsla(236, 50%, 50%, .3);
              --shadow-2: hsla(236, 50%, 50%, .4);

              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Open Sans', sans-serif;
          }

          .formbold-mb-3 {
            margin-bottom: 15px;
          }
          .formbold-relative {
            position: relative;
          }
          .formbold-opacity-0 {
            opacity: 0;
          }
          .formbold-stroke-current {
            stroke: currentColor;
          }
          #supportCheckbox:checked ~ div span {
            opacity: 1;
          }

          .formbold-main-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
          }

          .formbold-form-wrapper {
            margin: 0 auto;
            max-width: 570px;
            width: 100%;
            background: white;
            padding: 40px;
          }

          .formbold-img {
            margin-bottom: 45px;
          }

          .formbold-form-title {
            margin-bottom: 30px;
          }
          .formbold-form-title h2 {
            font-weight: 600;
            font-size: 28px;
            line-height: 34px;
            color: #07074d;
          }
          .formbold-form-title p {
            font-size: 16px;
            line-height: 24px;
            color: #536387;
            margin-top: 12px;
          }

          .formbold-input-flex {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
          }
          .formbold-input-flex > div {
            width: 50%;
          }
          .formbold-form-input {
            text-align: center;
            width: 100%;
            padding: 13px 22px;
            border-radius: 5px;
            border: 1px solid #dde3ec;
            background: #ffffff;
            font-weight: 500;
            font-size: 16px;
            color: #536387;
            outline: none;
            resize: none;
          }
          .formbold-form-input:focus {
            border-color: #6a64f1;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.05);
          }
          .formbold-form-label {
            color: #536387;
            font-size: 14px;
            line-height: 24px;
            display: block;
            margin-bottom: 10px;
          }

          .formbold-checkbox-label {
            display: flex;
            cursor: pointer;
            user-select: none;
            font-size: 16px;
            line-height: 24px;
            color: #536387;
          }
          .formbold-checkbox-label a {
            margin-left: 5px;
            color: #6a64f1;
          }
          .formbold-input-checkbox {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
          }
          .formbold-checkbox-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 16px;
            margin-top: 2px;
            border: 0.7px solid #dde3ec;
            border-radius: 3px;
          }

          .formbold-btn {
            font-size: 16px;
            border-radius: 5px;
            padding: 14px 25px;
            border: none;
            font-weight: 500;
            background-color: #6a64f1;
            color: white;
            cursor: pointer;
            margin-top: 25px;
          }
          .formbold-btn:hover {
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.05);
          }

          .productCard {
             border: 1px solid black;
             display: inline-block;
             padding: 0.5rem 1rem;
             cursor: pointer;
          }

          .productCard .name {
             font-size: 1.4rem;
             font-weight: 600;
             color: black;
          }

          .productCard .category {
             display: flex;
             gap: 0.3vw;
             font-weight: 500;
          }

          #categories {
            
          }

          #categories button {
            font-size: 16px;
            border-radius: 5px;
            padding: 14px 25px;
            border: none;
            font-weight: 500;
            background-color: #6a64f1;
            color: white;
            cursor: pointer;
            margin-top: 25px;
          }

          #categories button:hover {
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.05);
          }

          .container {
              padding-bottom: 140px;
            }

            .popover-example {
              margin: 0 0 10px;
              list-style: none;
            }

            .popover-example li {
              display: inline-block;
              margin: 4px;
              padding: 0px;
            }

            .btn:focus {
              outline: none;
            }

            .modExample .btn {
              margin: 4px 8px 4px 0;
            }

            a,
a:link {
  font-family: inherit;
  text-decoration: none;
  cursor: pointer;
}

a:focus {
  outline: none;
}

button::-moz-focus-inner {
  border: 0;
}


/* box */
.box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  padding: 0 4rem 2rem;
}

.box:not(:first-child) {
  height: 45rem;
}

.box__title {
  font-size: 10rem;
  font-weight: normal;
  letter-spacing: .8rem;
  margin-bottom: 2.6rem;
}

.box__title::first-letter {
  color: var(--primary);
}

.box__p,
.box__info,
.box__note {
  font-size: 1.6rem;
}

.box__info {
  margin-top: 6rem;
}

.box__note {
  line-height: 2;
}


/* modal */
.modal-container {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;

  display: none;
  justify-content: center;
  align-items: center;

  width: 100%;
  height: 100%;

  /* --m-background is set as inline style */
}

/* using :target */
/*
when users will click/enter button(link) browser will add a #id in a url and when that happens we'll show our users the modal that contains that id.
*/
.modal {
  width: 60rem;
  padding: 4rem 2rem;
  border-radius: .8rem;

  color: var(--light);
  background: var(--background);
  box-shadow: var(--m-shadow, .4rem .4rem 10.2rem .2rem) var(--shadow-1);
  position: relative;

  overflow: hidden;
}

.modal__title {
  font-size: 3.2rem;
  margin-bottom:0.5rem;
}

.modal__text {
  padding: 0 4rem;
  margin-top: 2rem;

  font-size: 1.2rem;
  line-height: 2;
}

.modal img {
  width: 15vw;
}

.modal__btn {
  margin-top: 4rem;
  padding: 1rem 1.6rem;
  border: 1px solid var(--border-color);
  border-radius: 100rem;

  color: inherit;
  background: transparent;
  font-size: 1.4rem;
  font-family: inherit;
  letter-spacing: .2rem;

  transition: .2s;
  cursor: pointer;
}



.modal__btn:nth-of-type(1) {
  margin-right: 1rem;
}

.modal__btn:hover,
.modal__btn:focus {
  transform: translateY(-.2rem);
}

/* link-... */
.link-1 {
  font-size: 1.8rem;

  color: var(--light);
  background: var(--background);
  box-shadow: .4rem .4rem 2.4rem .2rem var(--shadow-1);
  border-radius: 100rem;
  padding: 1.4rem 3.2rem;

  transition: .2s;
}

.link-1:hover,
.link-1:focus {
  transform: translateY(-.2rem);
  box-shadow: 0 0 4.4rem .2rem var(--shadow-2);
}

.link-1:focus {
  box-shadow:
    0 0 4.4rem .2rem var(--shadow-2),
    0 0 0 .4rem var(--global-background),
    0 0 0 .5rem var(--focus);
}

.link-2 {
  width: 4rem;
  height: 4rem;
  border: 1px solid var(--border-color);
  border-radius: 100rem;

  color: inherit;
  font-size: 2.2rem;

  position: absolute;
  top: 2rem;
  right: 2rem;

  display: flex;
  justify-content: center;
  align-items: center;

  transition: .2s;
}

.link-2::before {
  content: '×';

  transform: translateY(-.1rem);
}

.link-2:hover,
.link-2:focus {
  background: var(--focus);
  border-color: var(--focus);
  transform: translateY(-.2rem);
}

.abs-site-link {
  position: fixed;
  bottom: 20px;
  left: 20px;
  color: hsla(0, 0%, 1000%, .6);
  font-size: 1.6rem;
}

    </style>
    <style id="category-coloring-style"></style>
  </head>
  <body>
    <main>

          <!-- Learn More: https://formbold.com -->
          <div class="formbold-form-wrapper">

              <div class="formbold-input-flex">
                <div>

        <div id="categories"></div>
        <div id="products">
            
        </div>

        <div class="formbold-main-wrapper">
          <!-- Author: FormBold Team -->
          <!-- Learn More: https://formbold.com -->
          <div class="formbold-form-wrapper">
            
            <form onsubmit="addCategory(event)" >
              <div class="formbold-form-title">
                <h2 class="">Create Category</h2>
                <p>
                  Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do
                  eiusmod tempor incididunt.
                </p>
              </div>

              <div class="formbold-input-flex">
                <div>
                  <label for="name" class="formbold-form-label">
                    Category name
                  </label>
                  <input
                    type="text"
                    name="name"
                    class="formbold-form-input"
                  />
                </div>
              </div>
              <button class="formbold-btn">ADD Category</button>
            </form>
          </div>
        </div>


        <!-- modal 3 -->
        <div class="box">
          <div class="modal-container" id="m3-o" style="--m-background: var(--global-background);">
        </div>
        <!-- /modal 3 -->
    </main>
	<script type="text/javascript" src="./main.js"></script>
  </body>
</html>
